chartBasicInfo:
  language: "en"
  charSet: "UTF-8"
  title: "Website Traffic Sources"
  chartWidth: "700px"
  chartHeight: "400px"
  chartType: "bar"

titleInfoBean:
  text: "Traffic Sources"
  subText: "Monthly Data"
  left: "center"
  top: "10px"
  textStyle:
    fontSize: 18
    fontFamily: "Arial"
    fontWeight: "bold"
    color: "#333"
  subTextStyle:
    fontSize: 14
    fontFamily: "Arial"
    fontWeight: "normal"
    color: "#666"

toolTipInfoBean:
  trigger: "axis"
  axisPointer:
    type: "shadow"
  formatter: "{b}: {c}"
  backgroundColor: "#fff"
  borderColor: "#ccc"
  borderWidth: 1
  padding: [ 10, 15, 10, 15 ]
  textStyle:
    fontSize: 12
    fontFamily: "Arial"
    fontWeight: "normal"
    color: "#000"
  extraCssText: "font-size: 14px;"

legendInfoBean:
  orient: "horizontal"
  left: "center"
  bottom: "10px"
  textStyle:
    fontSize: 14
    fontFamily: "Arial"
    fontWeight: "normal"
    color: "#000"
  data:
    - "Search Engine"
    - "Direct"
    - "Email"
    - "Union Ads"
    - "Video Ads"

xaxisInfoBean:
  type: "category"
  data:
    - "Search Engine"
    - "Direct"
    - "Email"
    - "Union Ads"
    - "Video Ads"
  textStyle:
    fontSize: 12
    fontFamily: "Arial"
    fontWeight: "normal"
    color: "#666"

yaxisInfoBean:
  type: "value"
  textStyle:
    fontSize: 12
    fontFamily: "Arial"
    fontWeight: "normal"
    color: "#666"

seriesInfoBean:
  name: "Traffic Sources"
  type: "bar"
  data:
    - name: "Search Engine"
      value: 1200
      itemStyle:
        color: "#ff0000"
    - name: "Direct"
      value: 950
      itemStyle:
        color: "#00ff00"
    - name: "Email"
      value: 800
      itemStyle:
        color: "#0000ff"
    - name: "Union Ads"
      value: 600
      itemStyle:
        color: "#ffff00"
    - name: "Video Ads"
      value: 400
      itemStyle:
        color: "#00ffff"
  label:
    show: true
    position: "top"
    formatter: "{c}"
    fontSize: 12
    color: "#000"
    fontWeight: "bold"
    fontFamily: "Arial"
    backgroundColor: "#fff"
    padding: [ 5, 10 ]
    shadowColor: "rgba(0, 0, 0, 0.5)"
    shadowBlur: 10
    shadowOffsetX: 0
    shadowOffsetY: 0
