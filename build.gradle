plugins {
    id 'java'
}

group = 'com.main'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.11'
    implementation 'org.slf4j:slf4j-api:1.7.32'

    implementation 'commons-io:commons-io:2.11.0'

    implementation 'org.seleniumhq.selenium:selenium-java:4.12.0'
    implementation 'org.seleniumhq.selenium:htmlunit-driver:2.60.0'

    implementation group: 'org.yaml', name: 'snakeyaml', version: '2.3'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.15.2'

    implementation 'com.itextpdf:itext7-core:7.2.5'
    implementation 'com.itextpdf:kernel:7.2.5'  // iText 7 Kernel module
    implementation 'com.itextpdf:io:7.2.5'     // iText 7 I/O module


}

test {
    useJUnitPlatform()
}
